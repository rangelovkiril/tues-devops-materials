# ============================================================
# REUSABLE WORKFLOW vs COMPOSITE ACTION
# ============================================================
#
# Reusable Workflow:
#   - Is a full workflow (has its own jobs, runners)
#   - Called with `uses:` at the JOB level
#   - Can use services, containers, matrix, environment
#   - Good for: complete CI/CD pipelines shared across repos
#   - Caller passes inputs and secrets explicitly
#
# Composite Action:
#   - Is a sequence of steps (runs inside existing job)
#   - Called with `uses:` at the STEP level
#   - Cannot define jobs, services, or matrix
#   - Good for: repeated step sequences within a workflow
#   - Has access to the job's env and context
#   - Must specify `shell:` on every `run:` step
#
# Rule of thumb:
#   - Sharing steps → composite action
#   - Sharing entire jobs/pipelines → reusable workflow
