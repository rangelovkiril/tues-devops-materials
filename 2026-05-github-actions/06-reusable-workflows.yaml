# ============================================================
# GitHub Actions — Reusable Workflows & Composite Actions
# ============================================================
# Two ways to share logic: reusable workflows (workflow_call)
# and composite actions. Different scopes, different use cases.


# ============================================================
# REUSABLE WORKFLOWS
# ============================================================
# A workflow that other workflows can call like a function.
# Lives in .github/workflows/ like any other workflow.
# Triggered by workflow_call instead of push/pr/etc.

# --- DEFINING a reusable workflow ---
# File: .github/workflows/deploy-reusable.yml

name: Reusable Deploy

on:
  workflow_call:
    # Inputs — parameters the caller passes in
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string # string | boolean | number
      image_tag:
        description: "Docker image tag"
        required: true
        type: string
      dry_run:
        description: "Skip actual deployment"
        required: false
        type: boolean
        default: false

    # Secrets — the caller must explicitly pass secrets
    secrets:
      DEPLOY_TOKEN:
        required: true
      # Or use: secrets: inherit (caller passes ALL its secrets)

    # Outputs — return values to the caller
    outputs:
      deploy_url:
        description: "URL of the deployment"
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy
        if: inputs.dry_run == false
        run: |
          echo "Deploying ${{ inputs.image_tag }} to ${{ inputs.environment }}"
          echo "url=https://${{ inputs.environment }}.example.com" >> $GITHUB_OUTPUT
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}


