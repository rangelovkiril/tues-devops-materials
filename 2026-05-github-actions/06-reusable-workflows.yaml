# Reusable workflow limits:
#   - Max 4 levels of nesting (A calls B calls C calls D)
#   - Max 20 reusable workflows per workflow file
#   - env vars from the caller do NOT propagate (use inputs)
#   - The called workflow runs in the CALLER's context (same repo permissions)


# ============================================================
# COMPOSITE ACTIONS
# ============================================================
# A custom action made of multiple steps (no Docker, no JS — just YAML steps).
# Lives in a directory with an action.yml file.
# Lighter than reusable workflows, better for shared step sequences.

