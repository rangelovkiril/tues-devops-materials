# ============================================================
# GitHub Actions — Secrets, Variables, Environments, OIDC
# ============================================================


name: Secrets & Env Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # --- SECRETS ---
  # Encrypted, masked in logs, set in Settings → Secrets and variables.
  # Three scopes: repository, environment, organization.

  using_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Use a secret
        run: echo "Deploying..."
        env:
          API_KEY: ${{ secrets.API_KEY }}
          # Secrets are masked — if the value appears in logs,
          # GitHub replaces it with ***.
          # NEVER echo a secret directly.

      - name: Secret in action input
        uses: some-org/deploy-action@v1
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}

    # GITHUB_TOKEN is a special auto-generated secret.
    # Scoped to the repo, expires after the job.
    # Permissions controlled by the permissions key.


  # --- VARIABLES (vars) ---
  # Plaintext configuration. NOT secret — visible in logs.
  # Also set in Settings → Secrets and variables → Variables.
  # Same three scopes: repository, environment, organization.

  using_vars:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "App: ${{ vars.APP_NAME }}"
          echo "Region: ${{ vars.DEPLOY_REGION }}"

    # Use vars for: non-sensitive config (region, app name, feature flags)
    # Use secrets for: tokens, passwords, API keys, certificates


  # --- ENVIRONMENTS ---
  # Settings → Environments. Each environment can have:
  #   - Its own secrets and variables
  #   - Protection rules (required reviewers, wait timer)
  #   - Deployment branch restrictions
  #   - A URL (shown in the Actions UI and deployments page)

  deploy_staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - run: |
          # These resolve to the STAGING-scoped values
          echo "Deploying to ${{ vars.DEPLOY_URL }}"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  deploy_production:
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment:
      name: production
      url: https://example.com
    steps:
      # If production environment has "required reviewers",
      # this job pauses until someone approves in the UI.
      - run: echo "Deploying to production"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Same secret name, different value — scoped to production env

    # Secret/variable resolution order (most specific wins):
    #   1. Environment-level
    #   2. Repository-level
    #   3. Organization-level


  # --- OIDC (OpenID Connect) ---
  # Instead of storing cloud credentials as secrets,
  # the runner gets a JWT signed by GitHub.
  # The cloud provider verifies the JWT and grants access.
  # No static secrets to rotate.

  oidc_example:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for OIDC
      contents: read

    steps:
      # The OIDC token contains claims:
      #   - iss: https://token.actions.githubusercontent.com
      #   - sub: repo:org/repo:ref:refs/heads/main
      #   - aud: configurable
      #
      # Cloud provider validates these claims to decide access.

      # Azure example
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} # not a secret credential — just an ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # No password/certificate needed — OIDC handles auth

      # AWS example
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789:role/github-actions
      #     aws-region: eu-central-1

      # Vault example
      # - name: Vault login
      #   uses: hashicorp/vault-action@v3
      #   with:
      #     url: https://vault.example.com
      #     method: jwt
      #     role: github-actions
      #     # Runner's OIDC token is sent to Vault automatically

    # OIDC benefits:
    #   - No long-lived credentials
    #   - Can restrict by repo, branch, environment, PR vs push
    #   - Audit trail (who triggered what)
    #   - Works with Azure, AWS, GCP, HashiCorp Vault, and others
