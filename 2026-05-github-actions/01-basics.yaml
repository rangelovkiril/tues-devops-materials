# ============================================================
# GitHub Actions Basics — Structure, Triggers, Jobs, Steps
# ============================================================
# Workflow files live in .github/workflows/*.yml
# Each file is one workflow.


# --- NAME ---

# Display name in the Actions tab. Optional — without it, GitHub shows the filename.
name: CI Pipeline


# --- TRIGGERS (on) ---

# Single event
# on: push

# Multiple events
on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "package.json"
    tags:
      - "v*" # v1.0, v2.3.1, etc.

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # default if omitted

  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: "Dry run only"
        type: boolean
        default: false

  # Cron schedule (UTC)
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC

# Other trigger events (not exhaustive):
#   issues, issue_comment, release, deployment,
#   discussion, label, milestone, project,
#   create, delete, fork, star, watch,
#   workflow_call (reusable), workflow_run (chaining),
#   repository_dispatch (external webhook)


# --- PERMISSIONS ---

# Restrict GITHUB_TOKEN scope. Good practice: default to nothing,
# grant per-job only what's needed.
permissions: {}


# --- DEFAULTS ---

# Default shell and working directory for all run steps
defaults:
  run:
    shell: bash
    working-directory: ./app


# --- ENVIRONMENT VARIABLES ---

# Available to all jobs and steps
env:
  NODE_ENV: production
  CI: "true"


# --- JOBS ---

jobs:
  # Each job runs on a separate runner (VM).
  # Jobs run in parallel by default.

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    # Job-level permissions override workflow-level
    permissions:
      contents: read

    steps:
      # uses — runs an action (from marketplace, same repo, or other repo)
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: # inputs for the action
          node-version: 20
          cache: npm

      # run — executes a shell command
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Sidecar containers for the job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
        env: # step-level env
          DATABASE_URL: postgres://postgres:test@localhost:5432/testdb

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test] # waits for both to pass

    # Connect to a GitHub Environment (Settings → Environments)
    # Enables protection rules: required reviewers, wait timers, branch policies
    environment:
      name: production
      url: https://example.com

    permissions:
      contents: read
      id-token: write # for OIDC auth

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: echo "Deploying to production..."

    # Job-level timeout (default is 360 minutes!)
    timeout-minutes: 15


# --- STEP FEATURES ---

# Not shown above but important:
#
# continue-on-error: true
#   Step can fail without failing the job.
#   Useful for non-critical steps (notifications, optional checks).
#
# timeout-minutes: 5
#   Per-step timeout.
#
# working-directory: ./subdir
#   Override default working directory for a single step.
#
# shell: python
#   Override default shell. Options: bash, sh, pwsh, python, cmd (Windows).
#
# Action version pinning:
#   uses: actions/checkout@v4           # tag (convenient)
#   uses: actions/checkout@abc123def    # commit SHA (secure)
#   uses: ./github/actions/my-action    # local action in same repo
#   uses: org/repo/.github/actions/x@v1 # action from another repo


