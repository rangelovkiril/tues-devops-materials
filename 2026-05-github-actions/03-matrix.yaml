# ============================================================
# GitHub Actions Matrix — Parametrized Jobs
# ============================================================
# Matrix generates multiple job instances from combinations of values.


name: Matrix Demo

on:
  push:
    branches: [main]

jobs:

  # --- BASIC MATRIX ---
  # Generates 6 jobs: 3 node versions × 2 OS
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]

      # fail-fast: true (default) — cancel all matrix jobs if one fails
      # fail-fast: false — let all finish regardless
      fail-fast: false

      # max-parallel: 2 — limit concurrent jobs (useful for rate-limited APIs)

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test


  # --- INCLUDE: add specific combinations ---
  test_with_extras:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [18, 20]
        os: [ubuntu-latest]

        # include adds entries to the matrix
        include:
          # Add a specific combination with extra variables
          - node: 22
            os: ubuntu-latest
            experimental: true

          # Add a completely different OS for one version
          - node: 20
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

      - name: Experimental notice
        if: matrix.experimental == true
        run: echo "This is an experimental build"


  # --- EXCLUDE: remove specific combinations ---
  cross_platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gcc, clang, msvc]
        exclude:
          # msvc only makes sense on Windows
          - os: ubuntu-latest
            compiler: msvc
          - os: macos-latest
            compiler: msvc
          # gcc doesn't work well on macOS
          - os: macos-latest
            compiler: gcc

    steps:
      - run: echo "Building with ${{ matrix.compiler }} on ${{ matrix.os }}"


  # --- SINGLE-DIMENSION MATRIX ---
  # Just one variable — useful for deploy-to-many or test-many-versions
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [eslint, prettier, tsc]
    steps:
      - uses: actions/checkout@v4
      - run: npm run ${{ matrix.tool }}


  # --- OBJECT MATRIX ---
  # Each entry is a full object — more readable for complex configs
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: staging
            url: https://staging.example.com
            cluster: staging-k8s
          - name: production
            url: https://example.com
            cluster: prod-k8s
    environment:
      name: ${{ matrix.target.name }}
      url: ${{ matrix.target.url }}
    steps:
      - run: |
          echo "Deploying to ${{ matrix.target.name }}"
          echo "Cluster: ${{ matrix.target.cluster }}"


  # --- DYNAMIC MATRIX (fromJSON) ---
  # Generate matrix values in a previous job.

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          # Could read from a file, API, or compute dynamically
          echo 'matrix={"service":["api","web","worker"]}' >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - run: echo "Building ${{ matrix.service }}"
