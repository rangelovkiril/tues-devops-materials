# ============================================================
# GitHub Actions — Advanced Triggers & Concurrency
# ============================================================


# ============================================================
# CONCURRENCY
# ============================================================
# Controls parallel execution of workflow runs.
# Same group name = only one run at a time.

name: Deploy

on:
  push:
    branches: [main]

# Workflow-level concurrency
concurrency:
  group: deploy-${{ github.ref }}
  # If a new run starts while one is in progress:
  #   cancel-in-progress: true  → cancel the old one
  #   cancel-in-progress: false → queue the new one (default)
  cancel-in-progress: true

# Common patterns:
#   group: ci-${{ github.ref }}
#     → one CI run per branch (new push cancels old)
#
#   group: deploy-production
#     → only one production deploy at a time
#
#   group: pr-${{ github.event.pull_request.number }}
#     → one run per PR

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Job-level concurrency (overrides workflow-level for this job)
    concurrency:
      group: deploy-production
      cancel-in-progress: false # queue, don't cancel deploys

    steps:
      - run: echo "Deploying..."


# ============================================================
# WORKFLOW_RUN — Chain Workflows
# ============================================================
# Triggers when ANOTHER workflow completes.
# Runs in the context of the DEFAULT branch (main),
# not the PR branch. This gives it elevated permissions.

# Use case: Workflow A runs tests on a PR (limited permissions).
# Workflow B (triggered by workflow_run) posts results,
# adds labels, or deploys — things that need write access.

