# ============================================================
# SCHEDULE EDGE CASES
# ============================================================

# Schedule runs only on the default branch.
# Cron is in UTC. Minimum interval: 5 minutes (but GitHub may delay).
# Scheduled runs can be delayed by up to 15-60 minutes during peak load.
# If the repo has no activity for 60 days, scheduled workflows are disabled.

# Multiple schedules:
# on:
#   schedule:
#     - cron: "0 6 * * 1-5"   # weekdays at 6 AM UTC
#     - cron: "0 12 * * 0"    # Sunday at noon UTC


